<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Portfolio d'Emmanuel ADANDE, développeur web & desktop et designer UI/UX basé à Lomé, Togo." />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b5bff'/%3E%3Ctext x='32' y='45' font-size='34' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://api.iconify.design" crossorigin />
    <script>
      // Applique le thème avant le rendu (mémorisé, sinon préférence du système)
      try {
        var s = localStorage.getItem('portfolio-theme');
        var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (d) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
